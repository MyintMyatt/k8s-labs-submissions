apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-v2
  template:
    metadata:
      labels:
        app: log-output-v2
    spec:
      volumes:
        - name: shared-dir
          emptyDir: {}
      containers:
        # log writer container
        - name: log-writer
          image: log_writer:1.0
          env:
            - name: LOG_DIR
              value: /usr/src/app/logs/log.txt
          volumeMounts:
            - name: shared-dir
              mountPath: /usr/src/app/logs

        # log reader container
        - name: log-reader
          image: log_reader:1.0
          env:
            - name: LOG_DIR
              value: /usr/src/app/logs/log.txt
          volumeMounts:
            - name: shared-dir
              mountPath: /usr/src/app/logs
